</g></g>
<g transform="translate(444 4)"><g class="card" style="animation-delay:0.55s">
  <rect class="bg" width="408" height="156" rx="26"/>
  <rect class="edge" width="408" height="156" rx="26"/>
  <g transform="translate(66 78)"><g class="spin"><path d="M-22 -4 A22 22 0 0 1 14 -17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M14 -26 v10 h-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 4 A22 22 0 0 1 -14 17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M-14 26 v-10 h10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text class="h" x="120" y="62">Место везде</text>
  <text class="p" x="120" y="92">Начали на ноутбуке -</text>
  <text class="p" x="120" y="114">продолжите с телефона</text>
</g></g>
<g transform="translate(880 4)"><g class="card" style="animation-delay:1.10s">
  <rect class="bg" width="408" height="156" rx="26"/>
  <rect class="edge" width="408" height="156" rx="26"/>
  <g transform="translate(66 78)"><g class="b1"><circle cx="-18" cy="-6" r="8" fill="#fff"/><path d="M-32 18 a14 12 0 0 1 28 0z" fill="#fff"/></g><g class="b2"><circle cx="18" cy="-6" r="8" fill="#fff" opacity=".7"/><path d="M4 18 a14 12 0 0 1 28 0z" fill="#fff" opacity=".7"/></g><g class="b3"><circle cx="0" cy="-14" r="9" fill="#fff"/><path d="M-15 12 a15 13 0 0 1 30 0z" fill="#fff"/></g></g>
  <text class="h" x="120" y="62">Вместе с друзьями</text>
  <text class="p" x="120" y="92">Комнаты, чат, голос,</text>
  <text class="p" x="120" y="114">отзывы и общие подборки</text>
</g></g>
<g transform="translate(8 188)"><g class="card" style="animation-delay:1.65s">
  <rect class="bg" width="408" height="156" rx="26"/>
  <rect class="edge" width="408" height="156" rx="26"/>
  <g transform="translate(66 78)"><circle r="24" fill="none" stroke="#fff" stroke-width="2.5"/><ellipse rx="10" ry="24" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/><path d="M-24 0 H24 M-20 -12 H20 M-20 12 H20" stroke="#fff" stroke-width="2" opacity=".6" fill="none"/><g class="orbit"><circle cx="30" cy="0" r="4.5" fill="#fff"/></g></g>
  <text class="h" x="120" y="62">Доступ из интернета</text>
  <text class="p" x="120" y="92">Постоянная ссылка</text>
  <text class="p" x="120" y="114">без настройки роутера</text>
</g></g>
<g transform="translate(444 188)"><g class="card" style="animation-delay:2.20s">
  <rect class="bg" width="408" height="156" rx="26"/>
  <rect class="edge" width="408" height="156" rx="26"/>
  <g transform="translate(66 78)"><g class="scan"><circle cx="-4" cy="-4" r="17" fill="none" stroke="#fff" stroke-width="3"/><path d="M9 9 L24 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g><rect class="sc" x="-26" y="-26" width="52" height="3" rx="1.5" fill="#fff" opacity=".7"/></g>
  <text class="h" x="120" y="62">Описания сами</text>
  <text class="p" x="120" y="92">Постеры, сюжет, актёры</text>
