  <rect class="edge" width="408" height="156" rx="26"/>
  <g transform="translate(66 78)"><circle class="ring" cx="0" cy="0" r="26" fill="none" stroke="#fff" stroke-width="2"/><circle class="ring r2" cx="0" cy="0" r="26" fill="none" stroke="#fff" stroke-width="2"/><path class="beat" d="M-8 -13 L14 0 -8 13z" fill="#fff"/></g>
  <text class="h" x="120" y="62">Любые файлы</text>
