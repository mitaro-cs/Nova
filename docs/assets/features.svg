</g></g>
<g transform="translate(880 188)"><g class="card" style="animation-delay:2.75s">
  <rect class="bg" width="408" height="156" rx="26"/>
  <rect class="edge" width="408" height="156" rx="26"/>
  <g transform="translate(66 78)"><path d="M0 -26 L22 -18 V2 C22 15 11 23 0 28 C-11 23 -22 15 -22 2 V-18z" fill="#ffffff14" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path class="tick" pathLength="1" d="M-9 2 L-2 10 L11 -6" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text class="h" x="120" y="62">Безопасно</text>
  <text class="p" x="120" y="92">Argon2id и вход в два шага,</text>
  <text class="p" x="120" y="114">фильмы остаются у вас</text>
</g></g>
</svg>
