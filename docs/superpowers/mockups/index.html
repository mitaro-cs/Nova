<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova - макеты</title>
<style>
:root{
  --bg:#0b0d10; --bg2:#12151a; --card:#171b21; --card2:#1d222a; --line:#262c35;
  --txt:#eef1f4; --mut:#9aa4b0; --acc:#ffffff; --accbg:rgba(255,255,255,.1);
  --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --r:14px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--txt)}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin-bottom:4px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;
  background:var(--acc);color:#0b0d10;font-weight:600;border:0}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btn.danger{background:transparent;color:var(--err);border:1px solid #f8717144}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.field{display:grid;gap:6px}
.field>span{font-size:12.5px;color:var(--mut)}
.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);outline:none}
.input:focus{border-color:#fff8}
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;
  background:var(--card2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--accbg);border-color:#fff6}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--card2);border:1px solid var(--line);transition:.15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:.15s}
.switch input:checked+i{background:#fff}
.switch input:checked+i:after{left:20px;background:#0b0d10}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--txt);border-color:#fff}
.pill{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut)}
.pill.ok{color:var(--ok)} .pill.err{color:var(--err)} .pill.warn{color:var(--warn)}
.avatar{border-radius:50%;background:linear-gradient(135deg,#3a4a63,#22304a);display:flex;align-items:center;justify-content:center;font-weight:700}
.poster{border-radius:10px;background:linear-gradient(160deg,#2a3442,#141a22);display:flex;align-items:flex-end;padding:10px;font-size:12px}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--card2) 25%,#232a33 50%,var(--card2) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.errbox{border:1px solid #f8717144;background:#f8717112;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.errbox .t{color:var(--err);font-weight:600}
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty .ic{font-size:34px;margin-bottom:10px;opacity:.5}
.searchbar{display:flex;gap:8px}
.searchbar .input{flex:1}

/* шапка приложения */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 0;margin-bottom:8px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{padding:8px 12px;border-radius:8px;color:var(--mut)}
.nav button.on{background:var(--accbg);color:#fff}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ==== 1. АККАУНТ ==== */
.sec{border-top:1px solid var(--line);padding:16px 0}
.sec:first-of-type{border:0}
.sec h3{margin-bottom:4px}
.sec .hint{margin-bottom:12px}
.loginrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.loginrow code{color:var(--acc);font-size:15px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2)}

/* ==== 2. НАСТРОЙКИ ==== */
.setwrap{display:grid;grid-template-columns:220px 1fr;gap:18px}
@media(max-width:860px){.setwrap{grid-template-columns:1fr}}
.setnav{display:grid;gap:2px;align-content:start}
.setnav button{text-align:left;padding:9px 12px;border-radius:9px;color:var(--mut);font-size:14px}
.setnav button.on{background:var(--card2);color:#fff}
.setnav .cnt{float:right;font-size:11px;color:var(--mut)}
.setgroup{margin-bottom:14px}
.setitem{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:13px 0;border-bottom:1px solid #ffffff10;align-items:start}
.setitem .k{font-weight:600;font-size:14px}
.setitem .k code{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
.setitem .hint{grid-column:1/-1}
.setitem .ctl{justify-self:end;display:flex;gap:8px;align-items:center}
.def{font-size:11px;color:var(--mut);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}
.reset{color:var(--mut);font-size:12px;text-decoration:underline}
.dangerzone{border:1px solid #f8717144;border-radius:var(--r);padding:16px 20px;margin-top:8px}
.dangerzone h3{color:var(--err)}

/* ==== 3. ПЛЕЕР ==== */
.player{position:relative;height:100%;min-height:420px;border-radius:var(--r);overflow:hidden;
  background:radial-gradient(120% 90% at 30% 20%,#26314a 0%,#10141b 55%,#0a0c10 100%)}
.player .scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.5}
.player .scene .t{font-size:64px;font-weight:800;letter-spacing:2px;color:#fff3}
.p-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:22px}
.pbtn{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:20px}
.pbtn.big{width:74px;height:74px;font-size:26px}
.p-top{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;gap:10px;align-items:center;
  background:linear-gradient(#000a,transparent)}
.p-bot{position:absolute;bottom:0;left:0;right:0;padding:14px 18px 12px;background:linear-gradient(transparent,#000a)}
.seek{height:5px;border-radius:99px;background:#ffffff33;position:relative;margin-bottom:10px}
.seek i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:99px;background:#fff}
.seek b{position:absolute;left:38%;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px #ffffff33}
.p-meta{display:flex;gap:10px;align-items:center;font-size:13px;margin-bottom:10px}
.p-chips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{padding:6px 12px;border-radius:9px;background:rgba(0,0,0,.5);border:1px solid #ffffff22;font-size:12.5px;display:flex;gap:6px;align-items:center}
.pchip.on{background:#fff;color:#0b0d10;border-color:#fff;font-weight:600}
.syncbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid #ffffff33;
  padding:8px 14px;border-radius:99px;font-size:13px;display:flex;gap:10px;align-items:center}
.room-side{position:absolute;right:0;top:0;bottom:0;width:280px;background:#000a;border-left:1px solid #ffffff1a;
  padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.room-side .msg{background:#ffffff14;border-radius:10px;padding:8px 10px}
.room-side .msg b{color:#fff}
.reacts{position:absolute;left:18px;bottom:110px;display:flex;gap:8px}
.react{width:44px;height:44px;border-radius:50%;background:#000a;border:1px solid #ffffff33;display:flex;align-items:center;justify-content:center;font-size:20px}

/* ==== 4. ПРОФИЛЬ ==== */
.pf-hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:210px;
  background:linear-gradient(120deg,#3b4a68 0%,#1b2434 60%,#10151f 100%)}
.pf-hero .collage{position:absolute;inset:0;display:flex;gap:6px;padding:14px;opacity:.8}
.pf-hero .collage .poster{flex:1;height:180px}
.pf-hero .inner{position:relative;display:flex;gap:18px;align-items:flex-end;padding:16px;height:100%}
.pf-ava{position:relative}
.pf-ava .dot{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:3px solid var(--bg)}
.stat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.goal{margin-top:12px;max-width:340px}
.goal .bar{height:8px;border-radius:99px;background:#ffffff1a;margin-top:6px;overflow:hidden}
.goal .bar i{display:block;height:100%;width:62%;background:#fff;border-radius:99px}
.pf-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:18px}
@media(max-width:860px){.pf-grid{grid-template-columns:1fr}}
.pf-card{position:sticky;top:16px}
.medal{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin-right:12px}

/* ==== 5. ПОИСК ==== */
.sugg{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;max-width:560px}
.sugg .it{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #ffffff0d}
.sugg .it:last-child{border:0}
.sugg .it .ic{color:var(--mut);width:18px;text-align:center}
.sugg .it mark{background:#ffffff22;color:#fff;border-radius:3px;padding:0 1px}
.sugg .hd{padding:8px 14px;font-size:11.5px;color:var(--mut);background:var(--bg2);text-transform:uppercase;letter-spacing:.5px}
.didyou{background:#ffffff0a;border:1px dashed #ffffff33;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;max-width:560px}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mut)}

/* ==== 6. ЧАТ/КОМНАТА ==== */
.chat{display:grid;grid-template-columns:280px 1fr;height:560px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.clist{border-right:1px solid var(--line);background:var(--bg2);overflow:auto}
.clist .ci{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #ffffff08;align-items:center}
.clist .ci.on{background:var(--accbg)}
.clist .ci .nm{font-weight:600;font-size:14px}
.clist .ci .pv{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.cbody{display:flex;flex-direction:column}
.cmsgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:70%;padding:9px 13px;border-radius:14px;background:var(--card2);font-size:14px}
.msg.me{align-self:flex-end;background:#fff;color:#0b0d10}
.msg .who{font-size:11.5px;color:var(--mut);margin-bottom:3px}
.msg.me .who{color:#0b0d10aa}
.cinput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.conn{font-size:11.5px;color:var(--warn);display:flex;gap:6px;align-items:center}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}

/* ==== 7. СОСТОЯНИЯ ==== */
.state-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tv-focus{outline:3px solid #fff;outline-offset:2px;border-radius:10px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
.note{background:#ffffff08;border-left:3px solid #fff;padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;margin:10px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const Q = new URLSearchParams(location.search);
const S = Q.get('s') || 'account';
const V = Q.get('v') || '';
const $ = (h) => { app.innerHTML = h; };
const app = document.getElementById('app');

const TOP = `<div class="topbar"><span class="logo">◆ Nova</span>
  <nav class="nav"><button>Главная</button><button>Фильмы</button><button>Сериалы</button><button class="on">Обзор</button></nav>
  <div class="me"><span class="muted small">Хозяин Кино</span><div class="avatar" style="width:34px;height:34px;font-size:13px">ХК</div></div></div>`;

/* ---------- 1. АККАУНТ ---------- */
if (S === 'account') {
  if (V === 'a') { // вариант A: три отдельные карточки (рекомендация)
    $('' + TOP + `<h1>Профиль</h1><p class="muted">Аккаунт и безопасность</p>
    <div class="tabs"><button class="on">Оформление</button><button>Аккаунт и безопасность</button><button>Интерфейс</button></div>
    <div class="sec pane">
      <h3>Имя</h3><p class="hint">Как вас видят другие - в чатах, отзывах, списках.</p>
      <div class="row"><input class="input" style="max-width:320px" value="Хозяин Кино"><button class="btn sm">Сохранить</button></div>
    </div>
    <div class="sec pane">
      <h3>Логин</h3><p class="hint">По нему вы входите с других устройств. Меняется только вы; старый логин сразу перестаёт работать.</p>
      <div class="row"><code class="input" style="max-width:320px;font-family:ui-monospace">@host</code><button class="btn sm ghost">Изменить</button></div>
      <div class="loginrow"><span class="badge">занят</span><span class="muted small">login «host» уже используется</span></div>
    </div>
    <div class="sec pane">
      <h3>Пароль для входа с других устройств</h3><p class="hint">Сейчас вы входите только из приложения на этом компьютере. Задайте пароль, чтобы управлять сайтом с телефона.</p>
      <div class="grid2">
        <div class="field"><span>Новый пароль</span><input class="input" type="password" placeholder="Минимум 6 символов"></div>
        <div class="field"><span>Ещё раз</span><input class="input" type="password"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn sm">Сохранить пароль</button></div>
    </div>
    <div class="sec pane">
      <h3>Безопасность</h3><p class="hint">Второй шаг при входе и журнал входов. Доступно и без пароля.</p>
      <div class="row"><span class="chip">Вход в два шага <b>выкл</b></span><button class="btn sm ghost">Настроить</button></div>
      <div class="sec"><h3 class="small muted">Последние входы</h3>
        <div class="loginrow"><span>этот компьютер - окно</span><span class="pill ok">сейчас</span></div>
        <div class="loginrow"><span>iPhone - пароль</span><span class="muted small">вчера, 21:04</span></div>
      </div></div>`);
  } else { // вариант B: всё в одной карточке «Аккаунт»
    $('' + TOP + `<h1>Профиль</h1><p class="muted">Аккаунт и безопасность</p>
    <div class="tabs"><button class="on">Аккаунт и безопасность</button></div>
    <div class="pane">
      <div class="sec"><h3>Аккаунт</h3>
        <div class="grid2">
          <div class="field"><span>Имя</span><input class="input" value="Хозяин Кино"></div>
          <div class="field"><span>Логин</span><input class="input" value="host"></div>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn sm">Сохранить имя и логин</button></div>
      </div>
      <div class="sec"><h3>Пароль</h3>
        <div class="grid2">
          <div class="field"><span>Текущий пароль</span><input class="input" type="password"></div>
          <div class="field"><span>Новый пароль</span><input class="input" type="password"></div>
        </div>
        <div class="row" style="margin-top:12px"><button class="btn sm">Сменить пароль</button></div>
      </div>
      <div class="sec"><h3>Двухфакторный вход и журнал</h3>
        <div class="row"><span class="chip">TOTP выкл</span><button class="btn sm ghost">Включить</button>
        <button class="btn sm ghost">Журнал входов</button></div></div>
    </div>`);
  }
}

/* ---------- 2. НАСТРОЙКИ ---------- */
if (S === 'settings') {
  const groups = [
    ['profile','Профиль и безопасность',2],['access','Доступ из интернета',1],['folders','Папки и добавление',3],
    ['sources','Источники',4],['people','Люди и роли',1],['chat','Чат и комнаты',3],['player','Плеер',2],
    ['look','Оформление',1],['mail','Уведомления и почта',0],['upd','Обновления и копии',1]];
  const items = `
  <div class="setgroup"><h3>Сайт</h3>
    <div class="setitem"><div><div class="k">Название сайта<code>site.name</code></div><div class="hint">Видно зрителям в шапке и при входе.</div></div>
      <div class="ctl"><input class="input" style="width:180px" value="Nova"><button class="btn sm">OK</button><button class="reset">Сбросить</button></div></div>
    <div class="setitem"><div><div class="k">Язык описаний<code>meta.language</code></div><div class="hint">Русские описания без английских заглушек.</div></div>
      <div class="ctl"><span class="chip on">Русский</span><span class="chip">Как в источнике</span></div></div>
  </div>
  <div class="setgroup"><h3>Удалённое управление</h3>
    <div class="setitem"><div><div class="k">Управление не только в окне<code>security.manage_remote</code></div>
      <div class="hint">Включено - «Управление» доступно с телефона, но только с двухфакторным входом.</div></div>
      <div class="ctl"><label class="switch"><input type="checkbox" checked><i></i></label></div></div>
  </div>
  <div class="setgroup"><h3>Доступ из интернета</h3>
    <div class="setitem"><div><div class="k">Способ доступа<code>access.mode</code></div><div class="hint">cloudpub - постоянный адрес без своего домена.</div></div>
      <div class="ctl"><span class="chip on">CloudPub</span><span class="chip">FX Tunnel</span><span class="chip">Свой адрес</span><span class="chip">Только LAN</span></div></div>
    <div class="setitem"><div><div class="k">Регистрация<code>site.registration</code></div><div class="hint">Кто может завести аккаунт.</div></div>
      <div class="ctl"><span class="chip">По приглашению</span><span class="chip on">Открытая</span><span class="chip">Закрытая</span></div></div>
  </div>
  <div class="setgroup"><h3>Папки и добавление</h3>
    <div class="setitem"><div><div class="k">Папка для новых фильмов<code>media.inbox</code></div><div class="hint">Сюда можно перетаскивать файлы в окне приложения.</div></div>
      <div class="ctl"><code class="muted small">D:\\Media\\Inbox</code><button class="btn sm ghost">Выбрать</button></div></div>
  </div>
  <div class="setgroup"><h3>Источники видео</h3>
    <div class="setitem"><div><div class="k">Rutube<code>builtin:rutube</code></div>
      <div class="hint">Встроенный · все категории · <span class="pill ok">работает</span></div></div>
      <div class="ctl"><span class="chip">↑3</span><label class="switch"><input type="checkbox" checked><i></i></label><button class="btn sm ghost">Проверить</button></div></div>
    <div class="setitem"><div><div class="k">VK Видео<code>builtin:vk</code></div>
      <div class="hint">Встроенный · нужен ключ API · <span class="pill warn">ждёт ключ</span></div></div>
      <div class="ctl"><span class="chip">↑2</span><label class="switch"><input type="checkbox"><i></i></label><button class="btn sm ghost">Проверить</button></div></div>
    <div class="setitem"><div><div class="k">Internet Archive<code>builtin:archive</code></div>
      <div class="hint">Встроенный · все категории · <span class="pill ok">работает</span></div></div>
      <div class="ctl"><span class="chip">↑1</span><label class="switch"><input type="checkbox" checked><i></i></label><button class="btn sm ghost">Проверить</button></div></div>
    <div class="setitem"><div><div class="k">PeerTube<code>builtin:peertube</code></div>
      <div class="hint">Встроенный · все категории · <span class="pill ok">работает</span></div></div>
      <div class="ctl"><span class="chip">↑4</span><label class="switch"><input type="checkbox" checked><i></i></label><button class="btn sm ghost">Проверить</button></div></div>
