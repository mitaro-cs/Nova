name: CI
on:
  push:
    branches: [miaro]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy -p fsfy-server --all-targets -- -D warnings
      - run: cargo test -p fsfy-server

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Сквозные проверки: собранный сервер + демо-данные, Chromium (телефон и компьютер): вёрстка без наложений,
  # статусы, скорость. Видео-сценарии - в отдельном необязательном job ниже.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Интерфейс
        working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cargo build -p fsfy-server
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }

  # Сценарии с воспроизведением видео: информативные, красным конвейер не делают.
  e2e-media:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Интерфейс
        working-directory: web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - run: cargo build -p fsfy-server
      - name: Playwright (видео)
        working-directory: web
        env: { E2E_MEDIA: "1" }
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-media-report, path: web/playwright-report, retention-days: 7 }

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo clippy -p fsfy-desktop -- -D warnings
